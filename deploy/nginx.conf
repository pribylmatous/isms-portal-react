# Nginx konfigurace pro produkční build ISMS portálu (dist/).
#
# Frontend používá ruční hash routing (#/dashboard, #/incidents/...) — hash
# se prohlížečem na server nikdy neposílá, takže server vidí jen požadavky
# na "/" a na statické soubory. Není potřeba žádný SPA try_files fallback
# pro klientské cesty.
#
# API běží jako samostatný proces (isms-api, výchozí port 3001) — /api/ se
# proxuje na backend, aby frontend i API byly ze stejného originu (bez CORS).
# Uprav proxy_pass, pokud API neběží na stejném serveru.

server {
    listen 80;
    server_name isms.cdv.cz;  # uprav na skutečnou doménu

    root /var/www/isms-portal-react/dist;  # uprav na skutečnou cestu k dist/
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Session cookie musí projít beze změny — nic dalšího tu není potřeba,
        # nastavuje ji přímo isms-api (viz COOKIE_SECURE v jeho .env).
    }
}

# Až bude hotové TLS (viz zbytek pre-prod seznamu), přidat druhý server blok
# na portu 443 s ssl_certificate/ssl_certificate_key a přesměrovat port 80
# na https přes "return 301 https://$host$request_uri;".
